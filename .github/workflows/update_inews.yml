name: Update iNews Redirect Link

on:
  schedule:
    - cron: '0 */3 * * *' # Auto-update setiap 3 jam
  workflow_dispatch: # Boleh run manual

jobs:
  update-link:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Fetch and Extract iNews URL
      run: |
        # 1. Download playlist rujukan
        curl -s "https://raw.githubusercontent.com/apistech/project/refs/heads/main/playlists/rctiplus.m3u" -o rctiplus.m3u

        # 2. Ambil URL iNews yang paling segar
        INEWS_URL=$(grep -A 1 -i "iNews" rctiplus.m3u | grep -v "iNews" | grep "http" | tr -d '\r' | xargs)

        if [ -z "$INEWS_URL" ]; then
          echo "Ralat: URL iNews tidak dijumpai."
          exit 1
        fi

        # 3. Bina fail index.html untuk buat HTTP/HTML redirect
        # Cara ini akan paksa IPTV Player pergi ke URL iNews yang ada token terkini
        echo "<!DOCTYPE html><html><head>" > index.html
        echo "<meta http-equiv=\"refresh\" content=\"0; url=$INEWS_URL\">" >> index.html
        echo "<script>window.location.replace(\"$INEWS_URL\");</script>" >> index.html
        echo "</head><body>Redirecting to iNews...</body></html>" >> index.html

        echo "Redirect berjaya dihalakan ke: $INEWS_URL"

    - name: Commit and Push Changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        if git status --porcelain | grep -q "index.html"; then
          git add index.html
          git commit -m "Update iNews Redirect: $(date)"
          git push
        else
          echo "Tiada perubahan URL dikesan."
        fi
